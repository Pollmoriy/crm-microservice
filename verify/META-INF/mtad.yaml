_schema-version: 3.3.0
ID: crm-microservice
description: CRM microservice CAP application
version: 1.0.0
modules:
- name: crm-microservice-srv
  type: javascript.nodejs
  path: crm-microservice-srv
  requires:
  - name: crm-microservice-auth
  - name: crm-microservice-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
- name: crm-microservice-db-deployer
  type: com.sap.xs.hdi
  path: crm-microservice-db-deployer
  requires:
  - name: crm-microservice-db
  parameters:
    buildpack: nodejs_buildpack
- name: crm-microservice-ui
  type: javascript.nodejs
  path: crm-microservice-ui
- name: crm-microservice-ui-deployer
  type: com.sap.application.content
  path: crm-microservice-ui-deployer
  requires:
  - name: crm-microservice-html5-host
    parameters:
      content-target: true
- name: crm-microservice-approuter
  type: javascript.nodejs
  path: crm-microservice-approuter
  requires:
  - name: crm-microservice-auth
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: crm-microservice-html5-runtime
  parameters:
    keep-existing-routes: true
resources:
- name: crm-microservice-auth
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: crm-microservice-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: crm-microservice-html5-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: crm-microservice-html5-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
