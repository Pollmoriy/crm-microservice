_schema-version: "3.3.0"
ID: crm-microservice
version: 1.0.0
description: "CRM microservice CAP application"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: crm-microservice-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: crm-microservice-auth
      - name: crm-microservice-db

  - name: crm-microservice-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: crm-microservice-db

  - name: crm-microservice-ui
    type: html5
    path: app/crm-ui
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: crm-microservice-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: crm-microservice-html5-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: crm-microservice-ui
          artifacts:
            - '*.zip'
          target-path: resources/

  - name: crm-microservice-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
    requires:
      - name: crm-microservice-auth
      - name: crm-microservice-destination
      - name: crm-microservice-html5-runtime

resources:
  - name: crm-microservice-destination
    type: org.cloudfoundry.existing-service
    parameters:
        service-name: crm-microservice-destination

  - name: crm-microservice-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: crm-microservice-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: crm-microservice-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: crm-microservice-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime